version: "3.8"

# authors = "Thang Le (letrthang@gmail.com)"
# version = "1.0 - init version"

services:
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: http host.docker.internal:9090 # Points to your localhost:9090
    ports:
      - "4040:4040" # ngrok web interface: http://localhost:4040/
    environment:
      - NGROK_AUTHTOKEN=1eAWOQXMP3lAh16PI3mF5vvY6Il_6kxyybnTEiGHfWRrWJAGn # Your ngrok auth token

  postgres:
    image: 'bitnami/postgresql:18.3'
    #volumes:
      #- ./src/main/resources/v1_iattendance_schema_prd.sql:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - TZ=GMT+0
      - PGTZ=GMT+0

  redis:
    image: 'valkey/valkey:latest'
    restart: always
    ports:
      - "6379:6379"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - VALKEY_PASSWORD=

  rabbitmq:
    image: 'rabbitmq:4.2.5-management'
    ports:
      - "4369:4369"
      - "5672:5672"
      - "25672:25672"
      - "15672:15672" # web: http://localhost:15672/
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest